<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- App é em pt-BR. A tradução automática do navegador (Google Tradutor)
         reescreve o DOM embrulhando textos em <font>, o que conflita com o
         controle de DOM do React e quebra a página de conversas com
         "Failed to execute 'removeChild' on 'Node'". Declarar o idioma correto
         + bloquear tradução resolve a tela branca "Algo deu errado". -->
    <meta name="google" content="notranslate" />
    <!-- Marca Órbita (kit em marca-oryon/): favicon, ícone do iPhone e manifest.
         A prévia de link (og:image) entra pelo plugin previaDeLink do vite.config.ts
         quando VITE_SITE_URL estiver definido (ela precisa de URL absoluta). -->
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Oryon</title>
    <meta name="description" content="A Oryon atende seus clientes no WhatsApp com um agente de inteligência artificial, organiza as vendas e chama sua equipe quando uma pessoa precisa assumir." />
    <meta property="og:title" content="Oryon · Atendimento com IA no WhatsApp" />
    <meta property="og:description" content="Um agente de inteligência artificial responde seus clientes a qualquer hora e chama sua equipe quando uma pessoa precisa assumir." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <script>
      (function () {
        var t = localStorage.getItem('oryon-theme');
        // 'auto' segue o SO — resolvido aqui, antes do primeiro paint, para
        // não piscar dark→light quando o SO prefere claro (SCRUM-1100).
        var isLight = t === 'light' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        // As páginas públicas (landing) são só escuras (30/09, PO): o tema
        // claro da landing sai até ter um desenho próprio aprovado.
        var p = location.pathname;
        var publica = p === '/' || /^\/(plataforma|solucoes|perguntas|demonstracao|login|forgot-password|reset-password)(\/|$)/.test(p);
        if (isLight && !publica) document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
