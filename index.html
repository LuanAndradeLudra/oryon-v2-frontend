<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- App é em pt-BR. A tradução automática do navegador (Google Tradutor)
         reescreve o DOM embrulhando textos em <font>, o que conflita com o
         controle de DOM do React e quebra a página de conversas com
         "Failed to execute 'removeChild' on 'Node'". Declarar o idioma correto
         + bloquear tradução resolve a tela branca "Algo deu errado". -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/oryon-logo-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Oryon</title>
    <script>
      (function () {
        var t = localStorage.getItem('oryon-theme');
        // 'auto' segue o SO — resolvido aqui, antes do primeiro paint, para
        // não piscar dark→light quando o SO prefere claro (SCRUM-1100).
        var isLight = t === 'light' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (isLight) document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
